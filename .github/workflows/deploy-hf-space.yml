name: Deploy Helix Server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Hugging Face Hub client
        run: python -m pip install 'huggingface_hub>=0.30,<2'
      - name: Upload server to Hugging Face Space
        env:
          HF_DEPLOY_TOKEN: ${{ secrets.HF_DEPLOY_TOKEN }}
        run: python scripts/deploy_space.py
