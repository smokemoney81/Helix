<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030a17">
  <meta name="app-version" content="1.2.0">
  <title>HELIX · Modelle entdecken</title>
  <link rel="icon" href="./helix-icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script src="./scene.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-mark" viewBox="0 0 32 32"><path d="M16 3v26M3 16h26M7 7l18 18M25 7 7 25"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9.5 3 .6-2h3.8l.6 2 2.3 1.3 2-.5 1.9 3.3-1.4 1.5v2.8l1.4 1.5-1.9 3.3-2-.5-2.3 1.3-.6 2h-3.8l-.6-2-2.3-1.3-2 .5-1.9-3.3 1.4-1.5V8.6L3.4 7.1l1.9-3.3 2 .5Z" transform="translate(0 2)"/><circle cx="12" cy="12" r="3.5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5.1 7a8 8 0 0 1 13.7-1L20 8M4 16l1.2 2A8 8 0 0 0 18.9 17"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8M9 6h3M9 9h3"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M7 8h10v8H7Z"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 3.2 6.8L22 12l-6.8 3.2L12 22l-3.2-6.8L2 12l6.8-3.2Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 17V5l11-2v12M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="17" cy="16" rx="3" ry="2"/></symbol>
  </defs></svg>

  <div class="scene" aria-hidden="true">
    <img class="scene-fallback" src="./assets/helix-scene.png" alt="" fetchpriority="high">
    <canvas id="helix-canvas"></canvas>
    <div class="scene-shade"></div>
  </div>

  <main class="app">
    <header class="topbar">
      <a class="brand" href="./" aria-label="HELIX Startseite"><span class="brand-mark"><svg><use href="#i-mark"/></svg></span><span>HELIX</span></a>
      <div class="header-actions">
        <span class="version" title="Softwareversion 1.2.0">V 1.2</span>
        <button class="icon-button update-button" id="updateButton" type="button" aria-label="Softwareupdate suchen" title="Softwareupdate suchen"><svg><use href="#i-refresh"/></svg></button>
        <button class="icon-button settings-button" id="settingsButton" type="button" aria-label="Einstellungen"><svg><use href="#i-settings"/></svg></button>
      </div>
    </header>

    <nav class="mode-nav" aria-label="Bereiche">
      <button class="glass-button" id="voiceButton" type="button">‹&nbsp; Voice</button>
      <span aria-current="page">Modelle</span>
      <button class="glass-button" id="videoButton" type="button">Video <svg><use href="#i-video"/></svg></button>
    </nav>

    <form class="command" id="commandForm">
      <button class="glass-button mic-button" id="micButton" type="button" aria-label="Spracheingabe starten"><svg><use href="#i-mic"/></svg></button>
      <input id="commandInput" aria-label="Befehl an Helix" placeholder="Sag oder schreib, was Helix tun soll" autocomplete="off">
      <button class="glass-button submit-button" type="submit">OK</button>
    </form>
    <p class="command-hint" id="commandHint">Bitte einen Befehl oder eine Idee eingeben.</p>

    <div class="helix-space" aria-hidden="true"></div>

    <section class="discovery" aria-labelledby="discoveryTitle">
      <h1 id="discoveryTitle">Modelle entdecken</h1>
      <p class="description">Öffentliche Modelle suchen; Ausführung kann Einschränkungen haben.</p>
      <div class="filters" role="group" aria-label="Modelltyp">
        <button type="button" class="filter" data-filter="Alle" aria-pressed="false">Alle</button>
        <button type="button" class="filter" data-filter="Video" aria-pressed="false"><svg><use href="#i-video"/></svg> Video</button>
        <button type="button" class="filter" data-filter="Bild" aria-pressed="false"><svg><use href="#i-spark"/></svg> Bild</button>
        <button type="button" class="filter active" data-filter="Audio" aria-pressed="true"><svg><use href="#i-audio"/></svg> Audio</button>
      </div>
      <button class="models-banner" id="modelsButton" type="button"><span aria-hidden="true">✓</span> 25 neue Modelle · Weitere suchen</button>
      <nav class="pagination" aria-label="Ergebnisseiten"><button disabled>‹ Zurück</button><span>1 / 1</span><button disabled>Weiter ›</button></nav>
      <a class="home-button" href="./">‹ Zur Startseite</a>
    </section>
  </main>

  <div class="toast" id="status" role="status" aria-live="polite" hidden></div>
  <dialog id="settingsDialog" aria-labelledby="settingsTitle">
    <div class="dialog-header"><h2 id="settingsTitle">Einstellungen</h2><button id="closeSettings" class="close-button" aria-label="Einstellungen schließen">×</button></div>
    <label class="motion-control"><span>Helix animieren</span><input id="motionToggle" type="checkbox" checked role="switch"></label>
    <p>Sanfte Bewegung mit abgestimmter Bodenreflexion.</p>
    <span class="dialog-version">HELIX · Version 1.2.0</span>
  </dialog>
</body>
</html>
